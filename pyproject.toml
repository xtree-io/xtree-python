[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xtree"
version = "0.1.0"
description = "Python client for the XTREE API — real-time raw data layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "XTREE", email = "business@xtree.io" }]
keywords = ["xtree", "wechat", "api", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-httpx>=0.30",
]

[project.urls]
Homepage = "https://www.xtree.io"
Documentation = "https://www.xtree.io/docs"
Repository = "https://github.com/xtree-io/xtree-python"

[project.scripts]
xtree = "xtree.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["xtree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
